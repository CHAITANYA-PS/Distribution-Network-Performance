<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="Dsphere password reset"><title>Reset Password | Dsphere</title><link rel="stylesheet" href="password-reset.css"></head><body><main class="reset-page"><section class="brand-section"><img src="logo.png" alt="Dsphere logo" class="brand-logo"><h1>Dsphere</h1><p>Distributor Operations Management Platform</p></section><section class="reset-card"><header class="card-heading"><h2>Reset Password</h2><p>Create a secure password for your account.</p></header><form id="resetForm" novalidate><div class="field"><label for="employeeId">Email / Employee ID</label><div class="input-box"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v14H3zM3 7l9 6 9-6"/></svg><input id="employeeId" autocomplete="username" placeholder="Enter your email or employee ID"><span class="error" id="employeeError"></span></div></div><div class="field">
    <label for="secretQuestion">Secret Question</label>

    <input
        type="text"
        id="secretQuestion"
        class="secret-question"
        value="What is your favourite color?"
        readonly
    >

    <input
        type="text"
        id="secretAnswer"
        class="secret-answer"
        placeholder="Enter your answer"
    >

    <span class="error" id="secretAnswerError"></span>
</div><div class="field"><label for="newPassword">New Password</label><div class="input-box"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 018 0v3M12 15v2"/></svg><input id="newPassword" type="password" autocomplete="new-password" placeholder="Enter your new password"><button class="eye" type="button" data-target="newPassword" aria-label="Show new password"><svg viewBox="0 0 24 24"><path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button><span class="error" id="newPasswordError"></span></div></div><div class="field"><label for="confirmPassword">Confirm Password</label><div class="input-box"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 018 0v3M12 15v2"/></svg><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Re-enter your new password"><button class="eye" type="button" data-target="confirmPassword" aria-label="Show confirmed password"><svg viewBox="0 0 24 24"><path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button><span class="error" id="confirmPasswordError"></span></div></div><div class="requirements"><span id="lengthRule">• At least 8 characters</span><span id="caseRule">• Uppercase and lowercase letters</span><span id="numberRule">• At least one number</span></div><button class="reset-button" type="submit">Reset Password</button><p class="form-status" id="formStatus" role="status" aria-live="polite"></p></form><div class="support"><a href="../Login/index.html">← Back to Login</a><span>Contact System Administrator for support.</span></div></section></main><div class="wave wave-left"></div><div class="wave wave-right"></div><script src="password-reset.js"></script></body></html>
