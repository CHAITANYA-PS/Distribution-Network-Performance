<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dsphere stakeholder login">
  <title>Login | Dsphere</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="login-page">
    <section class="brand-section" aria-label="Dsphere">
      <img src="logo.png" alt="Dsphere logo" class="brand-logo">
      <h1>Dsphere</h1>
      <p>Distributor Operations Management Platform</p>
    </section>

    <section class="login-card">
      <div class="card-heading">
        <h2>Welcome Back</h2>
        <p>Login to continue to your dashboard.</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="userId">Email / Employee ID</label>
          <div class="input-box">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v14H3z"></path><path d="M3 7l9 6 9-6"></path></svg>
            <input id="userId" name="userId" type="text" autocomplete="username" placeholder="Enter your email or employee ID" aria-describedby="userError" required>
          </div>
          <span class="error" id="userError" role="alert"></span>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-box">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 018 0v3"></path><path d="M12 15v2"></path></svg>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" aria-describedby="passwordError" required>
            <button class="eye" id="togglePassword" type="button" aria-label="Show password" title="Show password">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
          <span class="error" id="passwordError" role="alert"></span>
        </div>

        <div class="options">
          <label class="remember"><input id="rememberMe" type="checkbox"><span class="checkmark" aria-hidden="true"></span>Remember me</label>
          <a href="../Password%20Reset/index.html" id="forgotPassword">Forgot Password?</a>
        </div>

        <button class="login-button" id="loginButton" type="submit">Login</button>
        <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
      </form>
      <div class="support">Contact System Administrator for account access and support.</div>
    </section>
  </main>
  <div class="wave wave-left" aria-hidden="true"></div>
  <div class="wave wave-right" aria-hidden="true"></div>
  <script src="login.js"></script>
</body>
</html>
