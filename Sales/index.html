<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Dsphere Distributor Operations Management Platform"
  >

  <title>Dsphere | Sales Manager</title>

  <!-- PNG favicon -->
  <link
    rel="icon"
    type="image/png"
    href="logo.png"
  >

  <!-- Shared Sales Manager stylesheet -->
  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body data-page="dashboard">

  <div class="app-shell">

    <!-- =====================================
         Sidebar
         ===================================== -->

    <aside
      class="sidebar"
      id="sidebar"
      aria-label="Sales Manager navigation"
    >
      <!-- Navigation items are generated by app.js -->
      <nav
        id="mainNav"
        aria-label="Main navigation"
      ></nav>

      <div class="sidebar-footer">
        <span
          class="status-dot"
          aria-hidden="true"
        ></span>

        Local data enabled
      </div>
    </aside>

    <!-- =====================================
         Main application
         ===================================== -->

    <main class="main">

      <!-- =====================================
           Full-width top bar
           ===================================== -->

      <header class="topbar">

        <!-- Dsphere brand -->
        <a
          class="brand header-brand"
          href="index.html"
          aria-label="Open Sales Manager dashboard"
        >
          <img src="assets/dsphere-logo.png" alt="Dsphere logo" />

          <span class="brand-text">
            <strong>Dsphere</strong>

            <small>
              Distributor Operations Management Platform
            </small>
          </span>
        </a>

        <!-- Global search -->
        <div class="search-wrap">
          <span
            class="search-icon"
            aria-hidden="true"
          >
            ⌕
          </span>

          <input
            id="globalSearch"
            type="search"
            placeholder="Search distributors, alerts, reports..."
            aria-label="Search distributors, alerts and reports"
            autocomplete="off"
          >
        </div>

        <!-- Header actions -->
        <div class="header-actions">

          <!-- Notifications -->
          <button
            class="icon-button"
            id="notifyButton"
            type="button"
            aria-label="Open notifications"
            title="Notifications"
          >
            <span aria-hidden="true">🔔</span>

            <span
              class="badge"
              id="notifyCount"
              aria-label="Notification count"
            >
              0
            </span>
          </button>

          <!-- Sales Manager profile -->
          <div class="profile">

            <span
              class="avatar"
              aria-hidden="true"
            >
              SM
            </span>

            <span class="profile-info">
              <strong>Sales Manager</strong>
              <small>Chennai Region</small>
            </span>

          </div>

          <!-- Logout button -->
           <a
        class="logout-button"
        href="../index.html"
        title="Logout from Dsphere"
        </span>

        <span class="logout-text">
          Logout
        </span>
      </a>


        </div>

      </header>

      <!-- =====================================
           Dynamic page content
           ===================================== -->

      <section
        id="app"
        class="content"
        aria-live="polite"
        aria-label="Sales Manager dashboard content"
      ></section>

    </main>

  </div>

  <!-- =====================================
       Mobile sidebar overlay
       ===================================== -->

  <div
    class="nav-overlay"
    id="navOverlay"
    aria-hidden="true"
  ></div>

  <!-- =====================================
       Toast notification
       ===================================== -->

  <div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
  ></div>

  <!-- =====================================
       Common application modal
       ===================================== -->

  <div
    id="modal"
    class="modal"
    aria-hidden="true"
  >
    <div
      class="modal-card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
    >
      <button
        class="modal-close"
        id="modalClose"
        type="button"
        aria-label="Close dialog"
        title="Close"
      >
        ×
      </button>

      <div id="modalBody"></div>
    </div>
  </div>

  <!-- Form validation -->
  <script src="validation.js"></script>

  <!-- Sales Manager application -->
  <script src="app.js"></script>

</body>
</html>
